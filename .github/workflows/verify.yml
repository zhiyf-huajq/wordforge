name: verify

# 能上 CI 的只有这四层 —— 它们零 npm 依赖、零出网：
#   build.js / check-structure.js / test-logic.js / verify-cn.js
#     -> 只 require('fs') / require('path') / require('vm')
# 其余五层（verify-settings / verify-read / shot / check-mobile-view / verify-cn-live）
#   需要真实 Chrome 或真实网络，留在本机手动跑，不进 CI。
#   理由：verify-cn-live 有 5 条依赖公益 CORS 中转，中转限流就会红。
#   「跟本次改动无关的随机红」会让 CI 很快被忽略，那还不如没有 CI。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 本仓库没有 package.json 的 dependencies，所以不需要 npm install

      # ① 产物新鲜度 —— 本 workflow 里最值钱的一步
      #    挡住的是最隐蔽的错：改了源码、验证也跑了、也全绿，
      #    但跑的是【旧产物】。
      #    不硬写 MD5：用 git diff 自维护，产物一变就自动跟着变。
      - name: 产物新鲜度
        run: |
          node _dev/build.js
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ 与源码不同步 —— 改了 build/ 里的源码但忘了重新 build"
            exit 1
          fi

      # ② 结构层：0 错误 / 0 警告
      - name: 结构
        run: node _dev/check-structure.js "dist/词匠-离线背单词.html"

      # ③ 逻辑层：纯 Node 假 DOM（不起浏览器）跑 663 条断言
      - name: 逻辑
        run: node _dev/test-logic.js "dist/词匠-离线背单词.html"

      # ④ 夹具解析：用抓下来的真实网页 / RSS 夹具离线跑解析器
      - name: 夹具解析
        run: node _dev/verify-cn.js "dist/词匠-离线背单词.html"
