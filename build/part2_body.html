<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="brand-mark"><svg><use href="#i-logo"/></svg></div>
      <div class="brand-txt"><b>词匠</b><span>WordForge</span></div>
    </div>
    <button class="nav on" data-go="today"><svg><use href="#i-sun"/></svg>今日</button>
    <button class="nav" data-go="study"><svg><use href="#i-book"/></svg>学习<span class="badge hide" id="navDue"></span></button>
    <button class="nav" data-go="review"><svg><use href="#i-rotate"/></svg>复习</button>
    <button class="nav" data-go="quiz"><svg><use href="#i-target"/></svg>测试</button>
    <button class="nav" data-go="read"><svg><use href="#i-read"/></svg>精读</button>
    <button class="nav" data-go="confuse"><svg><use href="#i-confuse"/></svg>易混词</button>
    <button class="nav" data-go="vocab"><svg><use href="#i-vocab"/></svg>词汇量</button>
    <div class="nav-sec">数据</div>
    <button class="nav" data-go="library"><svg><use href="#i-layers"/></svg>词库</button>
    <button class="nav" data-go="stats"><svg><use href="#i-chart"/></svg>统计</button>
    <button class="nav" data-go="settings"><svg><use href="#i-cog"/></svg>设置</button>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <h1 id="pgTitle">今日</h1>
      <span class="sub" id="pgSub"></span>
      <div class="tb-sp"></div>
      <button class="tb-btn" id="btnBook" title="切换词书"><svg><use href="#i-layers"/></svg><span id="curBookName" class="nowrap"></span></button>
      <button class="tb-btn" id="btnTheme" title="切换深浅色"><svg><use href="#i-moon"/></svg></button>
      <button class="tb-btn" id="btnQuick" title="快速学习"><svg><use href="#i-zap"/></svg>开始</button>
    </header>
    <div id="view"></div>
  </main>

  <nav id="mtab"></nav>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="storageWarn" class="hide" style="position:fixed;left:0;right:0;top:0;z-index:1500;background:var(--bad);color:#fff;padding:9px 16px;font-size:13px;text-align:center">
  本地存储写入失败：进度可能无法保存。<b>请到「设置 → 数据」导出备份</b>，或换用 Chrome / Edge 打开。
</div>
<input type="file" id="fileIn" class="hide" accept=".json,.csv,.txt">
